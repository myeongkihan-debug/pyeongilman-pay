<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>이메일 인증 — 평일만</title>
<style>
  body { margin:0; background:#f4f6fa; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:#1e2430; }
  main { max-width:520px; margin:48px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #dce2ec; border-radius:10px; padding:24px; }
  h1 { font-size:20px; color:#102a5c; margin:0 0 12px; }
  p, li { line-height:1.7; } .ok { color:#1e8c50; } .err { color:#dc3232; }
  small { color:#6b7484; }
</style>
</head>
<body>
<main><div class="card">
  <h1 id="title">이메일 인증을 확인하고 있습니다…</h1>
  <p id="msg"></p>
  <ol id="next" hidden>
    <li>이 창을 닫으세요.</li>
    <li>Pyeongilman 을 실행해 가입한 이메일·비밀번호로 <b>로그인</b>하세요.</li>
    <li>로그인 후 <b>구독 결제</b> → <b>관리자 승인</b> 순서로 진행됩니다.</li>
  </ol>
  <p><small>Pyeongilman — 38일선 전략기반 평생일꾼만들기(평일만) 투자관제센터</small></p>
</div></main>
<script>
(function () {
  // Supabase 인증 링크는 결과를 주소의 # 뒤(또는 ? 뒤)에 붙여 이 페이지로 보낸다.
  // 이 페이지는 로그인 토큰을 쓰거나 저장하지 않으며, 주소창에서 바로 지운다.
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const q = new URLSearchParams(location.search);
  const get = (k) => h.get(k) || q.get(k) || "";
  const err = get("error_code") || get("error");
  const desc = get("error_description");
  const type = get("type");
  try { history.replaceState(null, "", location.pathname); } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const show = (ok, title, msg) => { $("title").textContent = title; $("title").className = ok ? "ok" : "err"; $("msg").textContent = msg; };

  if (err) {
    if (/otp_expired|expired/i.test(err + " " + desc))
      show(false, "인증 링크가 만료되었거나 이미 사용되었습니다",
        "이미 인증을 마쳤다면 Pyeongilman 에서 바로 로그인하세요. 로그인 시 '이메일 인증 미완료'가 나오면 로그인 창의 안내에 따라 인증 메일을 다시 받으세요.");
    else
      show(false, "이메일 인증 실패", (desc ? desc.replace(/\+/g, " ") + " — " : "") + "Pyeongilman 에서 인증 메일을 다시 받거나 관리자에게 문의하세요.");
    $("next").hidden = !/otp_expired|expired/i.test(err + " " + desc);
    return;
  }
  show(true, type === "recovery" ? "본인 확인이 완료되었습니다" : "이메일 인증이 완료되었습니다",
    "가입한 이메일 주소가 확인되었습니다.");
  $("next").hidden = false;
})();
</script>
</body>
</html>
